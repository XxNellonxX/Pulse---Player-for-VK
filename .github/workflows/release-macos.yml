name: macOS build verification

on:
  workflow_dispatch:
  push:
    tags: ['v*', '!v*-macos-preview']

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      PULSE_IMPORT_ARCH: ${{ matrix.arch }}
      PULSE_GATEWAY_URL: ${{ vars.PULSE_GATEWAY_URL }}
      PULSE_SPOTIFY_CLIENT_ID: ${{ vars.PULSE_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:gateway
      - run: node --test qa/*.node.mjs
      - run: npm run prepare:imports
      - run: |
          if [ -z "$PULSE_GATEWAY_URL" ]; then unset PULSE_GATEWAY_URL; fi
          npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.macos.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
